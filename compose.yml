services:
  toolshed:
    build: .
    image: toolshed
    restart: unless-stopped
    environment:
      OWNER_PASSWORD: ${OWNER_PASSWORD:?set OWNER_PASSWORD in .env}
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
      ADMIN_URL: ${ADMIN_URL:?set ADMIN_URL in .env}
      MAX_DISK_MB: ${MAX_DISK_MB:-5120}
    ports:
      # Agents reach port 4400 only through ts. Only the local proxy reaches the admin port.
      - ${ADMIN_HOST:-127.0.0.1}:${ADMIN_HOST_PORT:-4401}:4401
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp
    # 70 MB idle and two tool jobs of up to 392 MB each.
    mem_limit: 1g
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true

  # A tailnet node of its own, toolshed, that serves port 4400 over HTTPS inside the tailnet only.
  ts:
    image: tailscale/tailscale:v1.104.7
    restart: unless-stopped
    environment:
      # The node's name. Not the container's hostname, which would make toolshed resolve to ts.
      TS_HOSTNAME: toolshed
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env}
      TS_EXTRA_ARGS: --advertise-tags=tag:toolshed
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - ts-state:/var/lib/tailscale
      - ./tailscale:/config:ro
    depends_on:
      - toolshed

volumes:
  data:
  ts-state:
